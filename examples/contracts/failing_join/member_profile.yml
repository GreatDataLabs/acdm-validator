entity_name: member_profile
business_definition: "A governed member profile used in customer risk workflows."
primary_keys: [member_id]
trust_tier: T1
freshness_policy: {max_age: "24h"}
provenance_binding: [member_db]
cost_class: C1
risk_class: R2
allowed_agent_actions: [read, summarize, recommend]
human_approval_required: false
downstream_exposure_rules: {mask: [ssn, dob]}
owner: member-data-team
review_frequency: "30d"
certified_upgrade: null

