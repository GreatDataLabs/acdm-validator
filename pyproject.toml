[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acdm-validator"
version = "0.1.0"
description = "Design-time contract validation for Agent Contract Data Modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ravi Kiran Pagidi" }]
keywords = ["data-governance", "ai-governance", "contracts", "validation", "acdm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
acdm-validate = "acdm_validator.cli.main:main"

[project.urls]
Homepage = "https://github.com/ravikiranpagidi/acdm-validator"
Issues = "https://github.com/ravikiranpagidi/acdm-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acdm_validator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

